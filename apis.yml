aid: unusual-ventures
name: Unusual Ventures
description: >-
  Unusual Ventures is an early-stage venture capital firm for enterprise and technical founders,
  built around a proprietary product-market-fit method (the Unusual Field Guide and "Unusual Way to PMF").
  Founded in 2017 by John Vrionis and Jyoti Bansal (founder of AppDynamics and Harness), the firm makes a
  small number of investments each year, leading seed rounds such as Helios ($4M seed) and participating in
  Series A rounds such as Rime ($24M). Its portfolio spans AI, applied AI, infrastructure and cybersecurity,
  including PostHog, Qdrant, fal, Railway, Harness, Socket, Descope, Neon and Traceable. Check size, AUM and
  HQ are not published on its site.
